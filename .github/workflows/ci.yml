name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            textual: ""
          - python-version: "3.9"
            textual: "textual==0.82.0"
          - python-version: "3.12"
            textual: ""
          - python-version: "3.13"
            textual: ""

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ${{ matrix.textual }}

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest
